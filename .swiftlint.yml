# SwiftLint configuration
#
# Install:  brew install swiftlint
# Run:      swiftlint            (lint)
#           swiftlint --fix      (autocorrect what it can)
#
# The build does NOT depend on SwiftLint being installed — the run-script
# phase skips silently when the binary is missing, so a fresh clone still
# builds. CI installs it and treats warnings as errors.

included:
  - AppTemplate

excluded:
  - AppTemplate/Resources/Localizable.xcstrings
  - .build
  - DerivedData

# MARK: - Rules that are off by default but worth having

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call
  - yoda_condition

disabled_rules:
  # SwiftUI view bodies are legitimately deeply nested.
  - nesting
  # `id`, `to`, `at` are fine.
  - identifier_name
  # Owned by SwiftFormat (`--commas`). Leaving it on means the two tools
  # undo each other's work on every save — SwiftFormat adds the trailing
  # comma, SwiftLint reports it, forever.
  - trailing_comma
  # Superseded by the `no_todo_without_owner` custom rule below, which asks
  # for an owner rather than forbidding TODOs outright. A rule that flags
  # every TODO gets globally disabled within a week.
  - todo
  # SwiftUI's whole idiom is a trailing view builder alongside other closure
  # parameters (`AsyncContentView(state:retry:) { … }`). Correct advice for
  # ordinary APIs, wrong for view composition.
  - multiple_closures_with_trailing_closure
  # False-positives on `override class func`, which cannot be `static`.
  # `StubURLProtocol` overrides `URLProtocol.canInit(with:)`.
  - static_over_final_class

# MARK: - Thresholds
#
# Tuned to flag genuine problems rather than to nag. A type that trips
# `type_body_length` is usually a type doing two jobs.

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 400
  error: 600

type_body_length:
  warning: 250
  error: 350

function_body_length:
  warning: 50
  error: 80

function_parameter_count:
  warning: 6
  error: 8

cyclomatic_complexity:
  warning: 10
  error: 15

large_tuple:
  warning: 3
  error: 4

# MARK: - Hard failures
#
# These are the rules that catch the bugs this template exists to prevent.

force_cast: error
force_try: error
force_unwrapping: error
implicitly_unwrapped_optional: error

# MARK: - Custom rules

custom_rules:
  no_print:
    name: "print() in shipping code"
    regex: '(?<!\w)print\('
    message: "Use AppLogger instead of print() — print output is invisible in release builds and unstructured in Console."
    severity: error
    excluded: ".*Tests?/.*"
    # Code only. Without this the rule flags the doc comment on AppLogger
    # that explains why print() is banned — a rule that reports its own
    # documentation is a rule people learn to ignore.
    match_kinds:
      - identifier

  no_hardcoded_base_url:
    name: "Hardcoded API URL"
    regex: 'URL\(string:\s*"https?://'
    message: "Base URLs belong in Config/*.xcconfig and are read through APIConfig."
    severity: error
    excluded: ".*Tests?/.*"

  no_todo_without_owner:
    name: "Unowned TODO"
    regex: '(TODO|FIXME):(?!\s*\[)'
    message: "Tag TODOs with an owner or ticket, e.g. TODO: [PROJ-123] ..."
    severity: warning

reporter: "xcode"
