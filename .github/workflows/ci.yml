name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to the same branch cancels the in-flight run — macOS minutes
  # are expensive and a superseded run tells you nothing.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: AppTemplate.xcodeproj
  # Pin the simulator so a runner-image bump can't silently change what we test.
  DESTINATION: 'platform=iOS Simulator,name=iPhone 16,OS=latest'

jobs:
  # ── Fast feedback: style and placeholder checks run first and independently
  #    of the build, so a formatting mistake reports in under a minute.
  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install swiftlint swiftformat

      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

      # Non-blocking for now. `.swiftformat` enables opinionated rules
      # (organizeDeclarations, marktypes) that will reformat existing files the
      # first time they run, and a CI step that fails on a diff nobody has
      # applied yet just trains people to ignore it.
      #
      # Run `swiftformat .` once, commit the result, then delete this line to
      # make formatting enforced.
      - name: SwiftFormat
        continue-on-error: true
        run: swiftformat --lint . --reporter github-actions-log

      - name: Preflight
        run: |
          chmod +x Scripts/preflight.sh
          ./Scripts/preflight.sh

  build:
    name: Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-dd-${{ hashFiles('**/*.pbxproj', '**/*.xcconfig') }}
          restore-keys: ${{ runner.os }}-dd-

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme Development \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

  # ── Release-configuration builds. Catches the whole class of bugs that only
  #    appear with optimisation on or under a different set of compile flags —
  #    the ones that would otherwise surface first in TestFlight.
  archive:
    name: Build ${{ matrix.scheme }}
    runs-on: macos-15
    needs: [lint, build]
    strategy:
      fail-fast: false
      matrix:
        scheme: [Staging, Production]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app

      - name: Build ${{ matrix.scheme }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "${{ matrix.scheme }}" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}
